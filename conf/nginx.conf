# ============================================================
# OKX PMM 网关 v2 (OpenResty / nginx + LuaJIT)
# 功能与 v1 (Python) 对齐: 正则路由 + 透传 + 并发闸 + 每请求耗时日志
#
# 启动  : bash script/start.sh    (prefix 指向本项目目录)
# 停止  : bash script/stop.sh
# 重启  : bash script/restart.sh
# 热重载: bash script/reload.sh   (改路由规则后用它, 优雅重载不中断流量)
# 监听  : 8081 (v1 在 8080 并行运行, 便于对比)
# ============================================================

worker_processes 4;   # 与生产机核数匹配; 并发闸在 shared dict 全局生效, 与 worker 数无关
pid logs/nginx.pid;
error_log logs/error.log info;

events {
    worker_connections 65535;
}

http {
    # 临时文件路径统一放 logs/tmp 下, 保持项目根目录干净
    client_body_temp_path logs/tmp/client_body;
    proxy_temp_path logs/tmp/proxy;
    fastcgi_temp_path logs/tmp/fastcgi;
    uwsgi_temp_path logs/tmp/uwsgi;
    scgi_temp_path logs/tmp/scgi;

    # 全局并发计数(跨 worker), 上限见 lua/gateway.lua 的 MAX_CONCURRENT_FORWARD
    lua_shared_dict gw_active 1m;

    lua_package_path "$prefix/lua/?.lua;;";

    # 启动时加载路由表与公共逻辑(规则修改后需 reload)
    init_by_lua_block {
        require("gateway")
    }

    # 请求耗时日志格式(与 v1 的耗时行同构, parse_fwd.py / log_correlate.py 通用)
    log_format gateway escape=none
        '$gw_ts [$gw_client_ip] $gw_endpoint -> $gw_backend $gw_id_field=$gw_id '
        'total=$gw_total_ms fwd=$gw_fwd_ms$gw_slow status=$status';

    access_log off;   # 默认关闭, 各业务 location 单独开启

    # 动态后端选择: 实际 peer 由 access 阶段的路由结果决定(见 lua/gateway.lua)
    upstream gw_backend {
        server 0.0.0.1;   # 占位, 由 balancer_by_lua 覆盖
        balancer_by_lua_block {
            local ok, err = pcall(function() require("gateway").balance() end)
            if not ok then
                ngx.log(ngx.ERR, "balancer error: ", err)
                ngx.exit(500)
            end
        }
        keepalive 64;   # 每 worker 的保活连接池(最多 4x64=256 个空闲连接, 活跃并发由并发闸限制)
    }

    server {
        listen 8081;
        server_name _;

        # 声明自定义变量(供 lua 在 access/balancer/log 阶段赋值;
        # rewrite 阶段先初始化为空, log 阶段由 lua 覆盖后写入日志)
        set $gw_ts "";
        set $gw_client_ip "";
        set $gw_endpoint "";
        set $gw_backend "";
        set $gw_id_field "";
        set $gw_id "";
        set $gw_total_ms "";
        set $gw_fwd_ms "";
        set $gw_slow "";
        set $gw_backend_host "";
        set $gw_backend_port "";
        set $gw_acquired "";
        set $gw_released "";

        client_max_body_size 1m;
        client_body_buffer_size 128k;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # 调试用(上线前可移除): 查看并发计数
        location = /debug/counter {
            access_log off;
            content_by_lua_block {
                local n = ngx.shared.gw_active:get("active") or 0
                ngx.say("active=", n)
            }
        }

        # ---------------- pricing ----------------
        location = /OKXDEX/rfq/pricing {
            access_log logs/access.log gateway;
            access_by_lua_block {
                require("gateway").access_pricing()
            }
            proxy_pass http://gw_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_next_upstream off;
            # 后端连接失败/读超时 -> 返回空报价(与 v1 行为一致; 后端的 HTTP 4xx/5xx 正常透传)
            proxy_intercept_errors on;
            error_page 502 504 = @pricing_fallback;
            log_by_lua_block {
                require("gateway").log_request()
            }
        }

        # 注意: error_page 跳转到内部 location 后, 主 location 的 log 阶段不再执行,
        # 所以 fallback location 必须自己挂 access_log + log_by_lua(否则耗时日志缺失、
        # 且并发计数会因 release 未执行而泄漏)
        location @pricing_fallback {
            internal;
            access_log logs/access.log gateway;
            content_by_lua_block {
                require("gateway").empty_pricing_response()
            }
            log_by_lua_block {
                require("gateway").log_request()
            }
        }

        # ---------------- firm-order ----------------
        location = /OKXDEX/rfq/firm-order {
            access_log logs/access.log gateway;
            access_by_lua_block {
                require("gateway").access_firm_order()
            }
            proxy_pass http://gw_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_next_upstream off;
            proxy_intercept_errors on;
            error_page 502 504 = @firm_error;
            log_by_lua_block {
                require("gateway").log_request()
            }
        }

        location @firm_error {
            internal;
            access_log logs/access.log gateway;
            default_type application/json;
            return 504 '{"detail":"backend error"}';
            log_by_lua_block {
                require("gateway").log_request()
            }
        }
    }
}
